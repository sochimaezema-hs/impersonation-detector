[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "impersonation-detector"
version = "0.0.1"
description = "Detect lookalike domains, spoofed senders, and brand/support-team impersonation in messages — Unicode confusables (UTS #39), mixed-script checks, and learned scoring, built as middleware for messaging platforms."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sochima Ezema" }]
keywords = ["phishing", "homograph", "unicode", "confusables", "impersonation", "security", "uts39"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
impersonation-detector = "impersonation_detector.cli:main"

[project.urls]
Homepage = "https://github.com/sochimaezema-hs/impersonation-detector"

[tool.hatch.build.targets.wheel]
packages = ["src/impersonation_detector"]

[tool.ruff]
line-length = 100
